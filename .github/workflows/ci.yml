name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'  # keep in sync with .devcontainer/Dockerfile
      
      - name: Verify generated files are up to date
        run: |
          go generate ./boardtype/...
          git diff --exit-code
      
      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      
